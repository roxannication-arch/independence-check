/* ===== The check: 12 scenes. Core layers set READY days. ===== */
const Q = [
 {id:"people", tag:"Your home", q:"How many people do you feed?", hint:"Your plan is sized for them.", a:[["Just me",1],["Two of us",2],["Three or four",4],["Five or more",5]]},

 {id:"grow", tag:"Day 5", q:"Do you grow anything you eat?", a:[["Nothing",0],["A few herbs",1],["Some vegetables",2],["A real part of our food",3]]},
 {id:"docs", tag:"Day 7", q:"You have 15 minutes to leave. Your passports?", a:[["Somewhere",0],["I know where",1],["In one folder",2],["Folder, copies and a packed bag",3]]},
 {id:"near", tag:"Day 10", q:"Who near you would help?", a:[["Nobody",0],["Maybe one person",1],["A few neighbors",2],["A real circle",3]]}
];
const CORE = ["food","water","power","money"];

function calc(){
  const days = {}; CORE.forEach(k => days[k] = val(k) ?? 0);
  const ready = Math.min(...CORE.map(k => days[k]));
  const prep = Q.filter(q => q.id!=="people" && q.id!=="climate").map(q => (S.ans[Q.indexOf(q)] ?? 0) / 3);
  const indep = prep.reduce((s,x)=>s+x,0) / prep.length;
  const score = Math.round(97 - indep * 70);
  const order = CORE.slice().sort((a,b) => days[a]-days[b]);
  return {days, ready, score, indep: Math.round(indep*100), order, n: val("people") || 1};
}

/* first 7 moves, weakest first */
function moves(r){
  const n = r.n, out = [];
  const lib = {
    water:{t:"Store "+(3*n)+" gallons of water", d:"One gallon per person per day. Three days. Sealed, dark, dated."},
    power:{t:"Light and a charged phone", d:"One headlamp each. One power bank that charges a phone three times."},
    money:{t:"Cash in an envelope", d:"Three days of food and gas. Small bills. A place only adults know."},
    food:{t:"Three days you can eat cold", d:"Food your family already likes. One shelf. Date on every box."},
    cook:{t:"A way to cook", d:"A camp stove and four fuel cans. Outside only. Never indoors."},
    banks:{t:"A second way to pay", d:"A card from a second, unrelated bank. Keep it active."},
    signal:{t:"Numbers on paper", d:"Five numbers in every wallet. One meeting place everyone knows."},
    grow:{t:"Sprouts in a jar", d:"Lentils or mung beans. Rinse twice a day. Food in four days."},
    docs:{t:"One folder", d:"Copies of passports, IDs and insurance. One on paper, one in a secure cloud."},
    near:{t:"Meet one neighbor", d:"Say hi. Swap numbers. Ask what they'd need."}
  };
  const extra = ["cook","banks","signal","docs","grow","near"];
  r.order.forEach(k => { if (r.days[k] < 30) out.push(lib[k]); });
  extra.forEach(id => { if ((S.ans[Q.findIndex(q=>q.id===id)] ?? 0) <= 1) out.push(lib[id]); });
  extra.forEach(id => { if (!out.includes(lib[id])) out.push(lib[id]); });
  return out.slice(0,7);
}

}

function verdict(r){

  if (r.ready === CONFIG.alexDays) return `You're exactly where<br><em>Alex started.</em>`;
  if (r.ready < 14) return `You're ahead of Alex.<br><em>For now.</em>`;
  return `You're further than most.<br><em>Not at 30 yet.</em>`;
}

function render(){
  renderHud();
  document.body.classList.toggle("home", S.view==="home");
  app.innerHTML = S.view==="home" ? viewHome() : S.view==="quiz" ? viewQuiz() : S.full ? viewFull() : viewTeaser();
  const f = document.getElementById("mail"); if (f) f.addEventListener("submit", submitMail);
}

async function submitMail(e){
  e.preventDefault();
  const email = document.getElementById("email").value.trim(), err = document.getElementById("mailerr");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent = "That email doesn't look right."; err.hidden = false; return; }
  err.hidden = true;
  const fd = new FormData();
  fd.append("EMAIL", email); fd.append("BREAKDOWN", S.ans.join("")); fd.append("email_address_check", ""); fd.append("locale", "en");
  try{
    await fetch(CONFIG.leadUrl, {method:"POST", body:fd, mode:"no-cors"});
    track("ReportEmail", {ready: calc().ready});
    document.getElementById("mail").hidden = true; document.getElementById("mailok").hidden = false;
  }catch(x){ err.textContent = "Couldn't send. Check your connection and try again."; err.hidden = false; }
}

document.addEventListener("click", e => {
  const t = e.target.closest("button,a"); if (!t) return;
  if (t.dataset.go === "quiz"){ S.view="quiz"; S.i=0; S.ans=[]; S.full=false; track("StartCheck"); render(); scrollTo(0,0); return; }
  if (t.hasAttribute("data-back")){ if (S.i===0) S.view="home"; else S.i--; render(); return; }
  if (t.dataset.ans !== undefined){
    S.ans[S.i] = +t.dataset.ans; t.classList.add("sel");
    setTimeout(() => { if (S.i < Q.length-1) S.i++; else { S.view="result"; track("ReadyShown", {ready: calc().ready}); } render(); scrollTo(0,0); }, 170);
    return;
  }
  if (t.dataset.buy) track("ClickBuy", {where:t.dataset.buy});
});

(function restore(){
  try{
    const r = new URLSearchParams(location.search).get("r") || "";
    if (new RegExp("^[0-3]{" + Q.length + "}$").test(r)){ S.ans = r.split("").map(Number); S.view = "result"; S.full = true; }
  }catch(e){}
})();
render();
