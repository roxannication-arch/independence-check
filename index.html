<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>How much of your life do you own? · 30 Days Ready</title>
<meta name="description" content="Check your independence score in 2 minutes. Then need the system less, one legal step a day for 30 days.">
<meta property="og:title" content="How much of your life do you still own?">
<meta property="og:description" content="Check your independence score. Free. 2 minutes.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
/* Apple HIG: system font, semantic system colors, inset grouped lists, standard buttons. Light and dark follow the device. */
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --cell2:#F2F2F7; --label:#000000; --secondary:rgba(60,60,67,.6); --tertiary:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --tint:#007AFF; --red:#FF3B30; --orange:#FF9500; --green:#34C759; --bar:rgba(249,249,249,.94);
  --alex:var(--red); --ready:var(--orange); --ok:var(--green); --cold:var(--secondary); --cold2:var(--secondary); --ink:var(--label);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --head:var(--ui); --num:ui-rounded,-apple-system,"SF Pro Rounded",var(--ui);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --cell:#1C1C1E; --cell2:#2C2C2E; --label:#FFFFFF; --secondary:rgba(235,235,245,.6); --tertiary:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
  --tint:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158; --bar:rgba(22,22,24,.9);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--label);font-family:var(--ui);font-size:17px;line-height:1.29;letter-spacing:-.41px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:.37px;line-height:1.12}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:var(--tint)}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px;border-radius:10px}
em{font-style:normal;color:var(--secondary)}

/* Navigation bar */
.hud{position:sticky;top:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);padding-top:env(safe-area-inset-top,0px)}
.hud .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px}
.hud .cell{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--secondary)}
.hud .cell.ready{justify-content:flex-end}
.hud .k{font-size:13px;letter-spacing:-.08px}
.hud .v{font-size:17px;font-weight:600;color:var(--label);font-variant-numeric:tabular-nums}
.hud .ready .v{color:var(--orange)}
.hud .tag{font-size:17px;font-weight:600;color:var(--label);text-align:center}
.hud .tag:empty::before{content:"30 Days Ready"}
.ticker{display:none}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;padding:14px 20px;border-radius:14px;background:var(--tint);color:#fff;font-size:17px;font-weight:600;letter-spacing:-.41px;text-decoration:none;text-align:center;border:0;transition:opacity .15s}
.btn:active{opacity:.7}
.btn.alt{background:var(--fill);color:var(--tint)}
.textlink,.retake{justify-self:center;color:var(--tint);font-size:17px;text-decoration:none}
.small{font-size:13px;color:var(--secondary);letter-spacing:-.08px}
.center{text-align:center}
.under{text-align:center;font-size:13px;color:var(--secondary);margin-top:-6px}

/* Hero */
.hero{padding:20px 0 28px;display:grid;gap:16px}
.hero .top{display:flex;align-items:center;gap:12px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--cell);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;flex:none;border:.5px solid var(--sep)}
.avatar svg{width:48px;height:auto}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--fill);color:var(--secondary)}
.pill.red{color:var(--red)}
.eyebrow{font-size:15px;font-weight:600;color:var(--red);letter-spacing:-.24px}
.large{font-size:34px;font-weight:700;letter-spacing:.37px;line-height:1.12}
.hero .sub{font-size:17px;color:var(--secondary);line-height:1.35}
.hero .sub b{color:var(--label);font-weight:600}

/* Sections = inset grouped */
.sec{display:grid;gap:8px}
.block{padding:24px 0 8px}
.sec .k{font-size:13px;color:var(--secondary);text-transform:uppercase;letter-spacing:-.08px;margin-top:8px}
.h{font-size:28px;font-weight:700;letter-spacing:.36px;line-height:1.14;margin-bottom:4px}
.lead{font-size:17px;color:var(--secondary);line-height:1.35;margin-bottom:8px}
.group,.cuts,.ladder,.steps3,.faq,.timeline,.moves,.evid,.layers,.weeks,.opts{background:var(--cell);border-radius:10px;overflow:hidden;display:grid}
.cuts>*,.ladder>*,.steps3>*,.timeline>*,.moves>*,.evid>*,.weeks>*,.opts>*,.faq>*{position:relative}
.cuts>*+*::before,.ladder>*+*::before,.steps3>*+*::before,.timeline>*+*::before,.moves>*+*::before,.evid>*+*::before,.weeks>*+*::before,.opts>*+*::before,.faq>*+*::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}

/* Rows */
.cut{display:grid;grid-template-columns:80px 1fr;gap:12px;padding:11px 16px;align-items:start}
.cut b{font-size:13px;font-weight:600;color:var(--secondary);padding-top:2px;letter-spacing:-.08px}
.cut div{display:grid;gap:2px}
.cut strong{font-size:17px;font-weight:600}
.cut span{font-size:15px;color:var(--secondary);letter-spacing:-.24px}
.weeks .wk{padding:11px 16px;display:grid;gap:2px}
.wk .wn{font-size:13px;color:var(--secondary)}
.wk b{font-size:17px;font-weight:600}
.wk span:last-child{font-size:15px;color:var(--secondary)}
.dayc{background:var(--cell);border-radius:10px;padding:12px 16px;display:grid;gap:4px}
.dch,.dcf{display:flex;justify-content:space-between;font-size:13px;color:var(--secondary)}
.dayc b{font-size:17px;font-weight:600}
.dayc>span{font-size:15px;color:var(--secondary)}
.dcf .up{color:var(--green);font-weight:600}
.rung{display:grid;grid-template-columns:64px 1fr;padding:11px 16px;gap:12px}
.rung b{font-size:15px;font-weight:600;color:var(--secondary);font-variant-numeric:tabular-nums}
.rung span{font-size:17px}
.rung.red b,.rung.red span{color:var(--red)}
.steps3 div{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:11px 16px;align-items:center}
.steps3 b{width:24px;height:24px;border-radius:50%;background:var(--tint);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.ev{padding:12px 16px;display:grid;gap:4px}
.ev .ek{font-size:13px;color:var(--secondary)}
.ev b{font-size:17px;font-weight:600;padding-right:56px}
.ev p{font-size:15px;color:var(--secondary)}
.ev a{font-size:15px;text-decoration:none}
.stampreal{position:absolute;top:12px;right:16px;font-size:12px;font-weight:600;color:var(--green);background:var(--fill);padding:2px 8px;border-radius:999px}
.faq details{padding:0 16px}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;padding:11px 0;font-size:17px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--tertiary);border-bottom:2px solid var(--tertiary);transform:rotate(45deg);margin-top:4px;flex:none;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(-135deg);margin-top:8px}
.faq p{padding:0 0 12px;font-size:15px;color:var(--secondary)}
.foot{padding:24px 16px 96px;font-size:13px;color:var(--secondary);display:grid;gap:4px;text-align:center}

/* Offer card */
.offer{background:var(--cell);border-radius:10px;padding:16px;display:grid;gap:12px;margin-top:8px}
.offer h2{font-size:22px;font-weight:700;letter-spacing:.35px}
.offer>p{font-size:15px;color:var(--secondary)}
.offer ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.offer li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15px;letter-spacing:-.24px}
.offer li::before{content:"";width:12px;height:6px;border-left:2px solid var(--green);border-bottom:2px solid var(--green);transform:rotate(-45deg);margin:5px 0 0 3px}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price b{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.price s{font-size:17px;color:var(--secondary)}
.price span{font-size:13px;font-weight:600;color:var(--orange)}

/* Bottom toolbar */
.stickybar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.stickybar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.stickybar span{font-size:15px;color:var(--secondary)}
.stickybar button,.stickybar a{background:var(--tint);color:#fff;font-size:15px;font-weight:600;border-radius:999px;padding:8px 16px;text-decoration:none;white-space:nowrap}
body.home{padding-bottom:0}

/* Quiz */
.quiz{min-height:calc(100svh - 44px);display:flex;flex-direction:column;gap:16px;padding-block:12px 40px}
.qtop{display:flex;gap:12px;align-items:center;font-size:15px;color:var(--secondary);font-variant-numeric:tabular-nums}
.qtop button{color:var(--tint);font-size:17px;padding:6px 4px}
.qtop button::before{content:"";display:inline-block;width:10px;height:10px;border-left:2.5px solid var(--tint);border-bottom:2.5px solid var(--tint);transform:rotate(45deg)}
.qtop button{font-size:0}
.bar{flex:1;height:4px;border-radius:2px;background:var(--fill2);overflow:hidden}
.bar div{height:100%;background:var(--tint);transition:width .3s}
.qcard{padding:8px 0;display:grid;gap:8px}
.qcard .day{font-size:13px;font-weight:600;color:var(--secondary);text-transform:uppercase;letter-spacing:-.08px}
.qcard h2{font-size:28px;font-weight:700}
.qcard p{font-size:15px;color:var(--secondary)}
.opt{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;padding:13px 16px;font-size:17px;color:var(--label);background:var(--cell);min-height:48px}
.opt:active{background:var(--fill2)}
.opt.sel::after{content:"";width:6px;height:12px;border-right:2.5px solid var(--tint);border-bottom:2.5px solid var(--tint);transform:rotate(45deg);margin-right:4px}

/* Result */
.result{padding-block:16px 40px;display:grid;gap:16px}
.scorebox{display:flex;gap:16px;align-items:center;background:var(--cell);border-radius:10px;padding:16px}
.scorebox .n{font-size:48px !important;font-weight:700;color:var(--orange) !important;font-variant-numeric:tabular-nums;line-height:1}
.scorebox p{font-size:15px;color:var(--secondary)}
.scorebox p b{color:var(--label) !important;font-weight:600}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--sep);border-radius:10px;overflow:hidden}
.vs>div{background:var(--cell);padding:14px 12px;display:grid;gap:2px;justify-items:center;text-align:center}
.vs .who{font-size:13px;color:var(--secondary)}
.vs .d{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.vs .alex .d{color:var(--orange)}
.vs .u{font-size:13px;color:var(--secondary)}
.verdict{font-size:22px;font-weight:700;text-align:center;line-height:1.2}
.layers{padding:6px 0}
.layer{display:grid;grid-template-columns:72px 1fr 40px;gap:10px;align-items:center;padding:8px 16px;font-size:15px}
.track{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden}
.fill{height:100%;border-radius:3px}
.layer .dd{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.locked{position:relative;background:var(--cell);border-radius:10px;overflow:hidden;min-height:340px}
.locked .peek{padding:16px;display:grid;gap:10px;filter:blur(5px);opacity:.5;user-select:none;pointer-events:none}
.locked .gate{position:absolute;inset:0;display:grid;align-content:center;gap:12px;padding:16px;background:linear-gradient(180deg,transparent,var(--cell) 30%)}
.locked h3{font-size:22px}
.locked ul{margin:0;padding-left:20px;font-size:15px;color:var(--secondary);display:grid;gap:4px}
input[type=email]{width:100%;font:inherit;font-size:17px;color:var(--label);background:var(--fill);border:0;border-radius:10px;padding:14px 16px;-webkit-appearance:none}
input[type=email]::placeholder{color:var(--tertiary)}
.ok{background:var(--fill);color:var(--green);border-radius:10px;padding:14px 16px;font-size:15px;font-weight:600}
.err{color:var(--red);font-size:13px}
.tl{display:grid;grid-template-columns:72px 1fr;padding:11px 16px;gap:12px;font-size:17px}
.tl .when{font-size:15px;font-weight:600;color:var(--red);font-variant-numeric:tabular-nums}
.tl.goal .when{color:var(--green)}
.move{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:11px 16px;align-items:start}
.move .dn{font-size:13px;font-weight:600;color:var(--tint);background:var(--fill);border-radius:6px;text-align:center;padding:3px 0}
.move b{font-size:17px;font-weight:600;display:block}
.move span{font-size:15px;color:var(--secondary)}
.retake{background:none;border:0;padding:8px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ===== The check: 12 scenes. Core layers set READY days. ===== */

const CORE = ["food","water","power","money"];

const S = {view:"home", i:0, ans:[], full:false, src:"d"};
(function(){ try{

  if (/story|30daysready|alex|lastemployee/.test(v)) S.src = "s";

}catch(e){} })();
const HERO = {
  d:{eyebrow:"If your card froze tonight", stamp:"Account frozen", plate:"", line:`How much of your life<br><em>do you still own?</em>`,
     sub:`Money, food, water, power. All of it runs through systems you don't control. <b>Take the 2-minute check.</b> Get your independence score and the first thing that breaks.`},

     sub:`<b>How many days would your home last?</b> Water, food, power, cash. Take the 2-minute check. Get your number and the first thing that breaks.`}
};
const app = document.getElementById("app"), hud = document.getElementById("hud");
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const val = id => { const k = Q.findIndex(q => q.id===id); const a = S.ans[k]; return a==null ? null : Q[k].a[a][1]; };

function calc(){
  const days = {}; CORE.forEach(k => days[k] = val(k) ?? 0);
  const ready = Math.min(...CORE.map(k => days[k]));
  const prep = Q.filter(q => q.id!=="people" && q.id!=="climate").map(q => (S.ans[Q.indexOf(q)] ?? 0) / 3);

    hot:{t:"Stay cool without power", d:"Extra water, a battery fan, and the coolest room in the house picked in advance."},
    storm:{t:"A storm bag", d:"Papers in a waterproof pouch, a radio, and a route to higher ground everyone knows."}};
  r.order.forEach(k => { if (r.days[k] < 30) out.push(lib[k]); });
  const cl = CLIM[val("climate")]; if (cl) out.splice(2, 0, cl);
  extra.forEach(id => { if ((S.ans[Q.findIndex(q=>q.id===id)] ?? 0) <= 1) out.push(lib[id]); });
  extra.forEach(id => { if (!out.includes(lib[id])) out.push(lib[id]); });
  return out.slice(0,7);
}

async function submitBuyer(e){
  e.preventDefault();
  const email = document.getElementById("bemail").value.trim(), err = document.getElementById("berr");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent = "That email doesn't look right."; err.hidden = false; return; }
  err.hidden = true;
  const fd = new FormData();
  fd.append("EMAIL", email); fd.append("email_address_check", ""); fd.append("locale", "en");
  try{
    await fetch(CONFIG.buyerUrl, {method:"POST", body:fd, mode:"no-cors"});
    track("BuyerEmail");
    document.getElementById("buyer").hidden = true; document.getElementById("bok").hidden = false;
  }catch(x){ err.textContent = "Couldn't send. Check your connection and try again."; err.hidden = false; }
}

  renderHud();
  document.body.classList.toggle("home", S.view==="home");
  app.innerHTML = S.view==="paid" ? viewPaid() : S.view==="home" ? viewHome() : S.view==="quiz" ? viewQuiz() : S.full ? viewFull() : viewTeaser();
  const f = document.getElementById("mail"); if (f) f.addEventListener("submit", submitMail);
  const bf = document.getElementById("buyer"); if (bf) bf.addEventListener("submit", submitBuyer);
}

async function submitMail(e){
  e.preventDefault();
  const email = document.getElementById("email").value.trim(), err = document.getElementById("mailerr");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent = "That email doesn't look right."; err.hidden = false; return; }
  err.hidden = true;
  const fd = new FormData();
  fd.append("EMAIL", email); fd.append("BREAKDOWN", S.ans.join("") + "-" + S.src); fd.append("email_address_check", ""); fd.append("locale", "en");

    track("ReportEmail", {ready: calc().ready});
    document.getElementById("mail").hidden = true; document.getElementById("mailok").hidden = false;
  }catch(x){ err.textContent = "Couldn't send. Check your connection and try again."; err.hidden = false; }
}

document.addEventListener("click", e => {
  const t = e.target.closest("button,a"); if (!t) return;
  if (t.dataset.go === "quiz"){ S.view="quiz"; S.i=0; S.ans=[]; S.full=false; track("StartCheck"); render(); scrollTo(0,0); return; }
  if (t.hasAttribute("data-back")){ if (S.i===0) S.view="home"; else S.i--; render(); return; }
  if (t.dataset.ans !== undefined){
    S.ans[S.i] = +t.dataset.ans; t.classList.add("sel");
    setTimeout(() => { if (S.i < Q.length-1) S.i++; else { S.view="result"; track("ReadyShown", {ready: calc().ready}); } render(); scrollTo(0,0); }, 170);
    return;
  }
  if (t.dataset.buy) track("ClickBuy", {where:t.dataset.buy});
});

(function restore(){
  try{
    const qs = new URLSearchParams(location.search);
    if (qs.has("paid")){ S.view = "paid"; track("Purchase"); return; }
    const r = (qs.get("r") || "").replace(/-[sld]$/, "");
    if (new RegExp("^[0-3]{" + Q.length + "}$").test(r)){ S.ans = r.split("").map(Number); S.view = "result"; S.full = true; }
  }catch(e){}
})();
render();
